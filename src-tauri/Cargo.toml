[package]
name = "llm-usage-core"
version = "0.1.3"
edition = "2021"
description = "Private, lightweight LLM usage dashboard"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "llm_usage_core"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zeroize = "1"

# Windows: DPAPI secret storage (crypt32.dll loaded dynamically).
[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

# macOS: store credentials in the Keychain instead of DPAPI.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = "3"

[profile.release]
codegen-units = 16
lto = false
opt-level = "s"
panic = "abort"
strip = true
