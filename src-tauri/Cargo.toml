[package]
name = "llm-usage-core"
version = "0.1.0"
edition = "2021"
description = "Private, lightweight LLM usage dashboard"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "llm_usage_core"
path = "src/lib.rs"

[dependencies]
libloading = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
zeroize = "1"

[profile.release]
codegen-units = 16
lto = false
opt-level = "s"
panic = "abort"
strip = true
