[package]
name = "llm-usage-core"
version = "0.1.12"
edition = "2021"
description = "Private, lightweight LLM usage dashboard"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "llm_usage_core"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
zeroize = "1"
# OAuth loopback flows (PKCE S256 + device-safe randomness) for the
# subscription providers (Grok / Antigravity).
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"

# Windows: DPAPI secret storage (crypt32.dll loaded dynamically).
[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

# macOS/Linux: store credentials in the system keyring (Keychain / secret
# service) instead of DPAPI. secret.rs compiles the keyring paths for every
# non-Windows target, so the dependency must follow the same cfg.
[target.'cfg(not(target_os = "windows"))'.dependencies]
keyring = "3"

[profile.release]
codegen-units = 16
lto = false
opt-level = "s"
panic = "abort"
strip = true
