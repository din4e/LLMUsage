[package]
name = "llm-usage-core"
version = "0.1.0"
edition = "2021"
description = "Private, lightweight LLM usage dashboard"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "llm_usage_core"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
