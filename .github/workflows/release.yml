name: release

# Builds native Windows (.exe + NSIS) and macOS (.app + .dmg) artifacts and
# attaches them to the GitHub Release for the tag. The release body leads
# with the tagged version's CHANGELOG.md section, followed by the download
# notes.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.11)'
        required: true
        default: 'v0.1.11'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin --bundles app,dmg'
          - platform: windows-latest
            args: '--bundles nsis'
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Compose release body from CHANGELOG.md
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          # Slice the "## v<x.y.z>" section out of CHANGELOG.md: everything
          # from the matching heading up to (not including) the next "## ".
          awk -v ver="v${version}" '
            /^## / {
              if (in_section) exit
              in_section = ($0 ~ "^## " ver "([（(]|$)")
              next
            }
            in_section { print }
          ' CHANGELOG.md > changelog-section.md
          cat > release-notes.md <<'NOTES'
          **Downloads**
          - **macOS (Apple Silicon)**: `.dmg`
          - **Windows**: `_-setup.exe` (NSIS installer) and the raw `.exe`

          Builds are unsigned. On macOS the first launch may need
          *System Settings → Privacy & Security → Open anyway*.
          NOTES
          {
            echo "RELEASE_BODY<<CHANGELOG_EOF"
            if [ -s changelog-section.md ]; then
              cat changelog-section.md
              printf '\n---\n\n'
            fi
            cat release-notes.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'LLM Usage ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
