name: release

# Builds native Windows (.exe + NSIS) and macOS (.app + .dmg) artifacts and
# attaches them to the GitHub Release for the tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.2)'
        required: true
        default: 'v0.1.2'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'LLM Usage ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            Downloads:
            - **macOS (Apple Silicon)**: `.dmg`
            - **Windows**: `_-setup.exe` (NSIS installer) and the raw `.exe`

            Builds are unsigned. On macOS the first launch may need
            *System Settings → Privacy & Security → Open anyway*.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
