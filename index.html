<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111715" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23b8ef72'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='13' font-family='Arial' font-weight='700' fill='%23111711'%3ELU%3C/text%3E%3C/svg%3E" />
    <title>LLM Usage</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="rail" aria-label="主导航">
        <a class="brand" href="#dashboard" aria-label="LLM Usage 首页">LU</a>
        <nav>
          <a class="nav-item active" href="#dashboard" aria-current="page" aria-label="用量总览">⌁</a>
          <a class="nav-item" href="#providers" aria-label="供应商设置">◇</a>
        </nav>
        <button class="nav-item theme-button" id="theme-toggle" type="button" aria-label="切换明暗主题">◐</button>
      </aside>

      <main id="dashboard">
        <header class="topbar">
          <div>
            <p class="eyebrow">LOCAL · PRIVATE · LIVE</p>
            <h1>今日模型用量</h1>
          </div>
          <div class="topbar-actions">
            <span class="sync-status" id="sync-status" role="status"><i></i> 数据已就绪</span>
            <label class="auto-sync-control" for="auto-sync-interval"><span>自动</span><select id="auto-sync-interval" aria-label="自动拉取间隔"><option value="0">关闭</option><option value="60">1 分钟</option><option value="300">5 分钟</option><option value="900">15 分钟</option></select></label>
            <button class="refresh-button" id="refresh-button" type="button">立即同步</button>
          </div>
        </header>

        <section class="metric-strip" aria-label="今日总览">
          <article><span>请求</span><strong id="total-requests">—</strong><small>次调用</small></article>
          <article><span>Token</span><strong id="total-tokens">—</strong><small>输入 + 输出</small></article>
          <article><span>余额/成本</span><strong id="total-cost">—</strong><small>人民币口径</small></article>
          <article class="coverage"><span>在线覆盖</span><strong id="coverage">0 / 9</strong><small>已配置供应商</small></article>
        </section>

        <section class="section-heading">
          <div><p class="eyebrow">PROVIDERS</p><h2>供应商状态</h2></div>
          <p>在线用量优先 · 实验接口会单独标注</p>
        </section>

        <section class="provider-list" id="provider-list" aria-label="已配置供应商用量"></section>
        <section class="provider-empty" id="provider-empty">
          <div><strong>还没有已配置供应商</strong><span>添加后才会出现在主列表</span></div>
          <button class="row-action" type="button" data-action="open-catalog">添加供应商</button>
        </section>
        <section class="more-providers" id="providers">
          <span id="catalog-summary">未配置供应商集中收纳，不占用仪表盘空间</span>
          <button class="row-action" type="button" data-action="open-catalog">＋ 添加供应商</button>
        </section>
      </main>
    </div>

    <dialog id="provider-dialog" aria-labelledby="dialog-title">
      <form method="dialog" id="provider-form">
        <div class="dialog-heading"><div><p class="eyebrow">SECURE SETUP</p><h2 id="dialog-title">配置供应商</h2></div><button value="cancel" class="close-button" aria-label="关闭">×</button></div>
        <p class="dialog-copy" id="dialog-copy">密钥由 Windows DPAPI 加密，仅当前用户可解密，不会写入数据库或日志。</p>
        <div id="credential-fields"></div>
        <div class="dialog-actions"><button value="cancel" class="secondary-button">取消</button><button value="save" id="save-provider" class="refresh-button">保存并同步</button></div>
      </form>
    </dialog>

    <dialog id="catalog-dialog" aria-labelledby="catalog-title">
      <form method="dialog" class="catalog-form">
        <div class="dialog-heading"><div><p class="eyebrow">PROVIDER CATALOG</p><h2 id="catalog-title">添加供应商</h2></div><button value="cancel" class="close-button" aria-label="关闭">×</button></div>
        <p class="dialog-copy">只展示真实可查询的在线能力；不同地区和凭据类型分开配置。</p>
        <div class="provider-catalog" id="provider-catalog"></div>
      </form>
    </dialog>

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
